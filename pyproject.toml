[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharley"
version = "0.1.0"
description = "Independent verifier for AI-written code: sealed hidden tests, mutation-proven"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "httpx>=0.27", "pyyaml>=6", "fastapi>=0.110", "uvicorn>=0.29", "pymongo>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
agents = ["uagents>=0.18"]

[project.scripts]
sharley = "sharley.gate.cli:main"

[tool.setuptools.packages.find]
include = ["sharley*", "agents*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["docker: needs a running Docker daemon", "live: needs real provider API keys"]
